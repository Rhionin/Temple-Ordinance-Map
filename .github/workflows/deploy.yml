name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy for this ref at a time. A second push waits in the queue.
# cancel-in-progress stays false so a running Cloudflare call is not aborted.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cdaf2135c9b5b619074a6cfbb97f49af
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test test/
      - name: Seed D1 migration history
        id: d1_seed
        continue-on-error: true
        run: node scripts/prepare-d1-migrations.js
      - name: Apply D1 migrations
        id: d1_migrate
        continue-on-error: true
        run: npx wrangler d1 migrations apply temple-ordinance-map --remote
      - name: D1 migration summary
        if: always()
        run: |
          seed_ok="${{ steps.d1_seed.outcome }}"
          migrate_ok="${{ steps.d1_migrate.outcome }}"
          if [ "$seed_ok" = "success" ] && [ "$migrate_ok" = "success" ]; then
            echo "D1 migration seed and apply both succeeded."
            exit 0
          fi
          echo "::warning title=D1 migrations skipped or failed::Seed outcome=$seed_ok, apply outcome=$migrate_ok. Common cause: D1 free-tier daily read limit (resets 00:00 UTC). Worker deploy continues; poll-cache (#75) does not require migration 0007 indexes. Re-run this workflow with workflow_dispatch after quota resets to apply pending migrations."
          if [ "$seed_ok" != "success" ]; then
            echo "Seed step log: see step 'Seed D1 migration history' above."
          fi
          if [ "$migrate_ok" != "success" ]; then
            echo "Apply step log: see step 'Apply D1 migrations' above."
          fi
      - name: Deploy Worker
        run: |
          attempt=1
          while true; do
            if npx wrangler deploy --var BUILD_ID:${{ github.sha }}; then
              exit 0
            fi
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            echo "Deploy Worker failed on attempt ${attempt} of 3; retrying in 60s"
            sleep 60
            attempt=$((attempt + 1))
          done
