name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cdaf2135c9b5b619074a6cfbb97f49af
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test test/
      - run: npm ci
      - name: Seed D1 migration history
        run: node scripts/prepare-d1-migrations.js
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply temple-ordinance-map --remote
      - name: Deploy Worker
        run: npx wrangler deploy
