on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: npm ci
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests (browser required)
        run: node --test test/
        env:
          REQUIRE_BROWSER_TESTS: '1'
      - name: Wrangler bundle dry-run
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-bundle-ci
      - name: Worker bundle smoke (workerd + local D1)
        run: node scripts/worker-bundle-smoke.mjs
        env:
          WRANGLER_OUTDIR: /tmp/wrangler-bundle-ci
