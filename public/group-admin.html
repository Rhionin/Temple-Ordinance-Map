<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group admin</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#120a1c;color:#f6e7d0;display:flex;justify-content:center}
main{max-width:460px;padding:24px 18px 48px}h1{color:#ffa31a;font-size:1.6em;margin:.2em 0}
label{display:block;margin:14px 0 6px;color:#ffd08a}input{width:100%;box-sizing:border-box;background:#0d0716;color:#ffd08a;border:1px solid #5a2d6e;border-radius:10px;padding:12px;font-size:1em}
button{display:block;width:100%;margin-top:12px;background:linear-gradient(#ffb33a,#f07d00);color:#2a0f00;font-weight:700;padding:14px;border-radius:12px;font-size:1em;border:0;cursor:pointer}
button.quiet{background:#21132e;color:#ffd08a;border:1px solid #5a2d6e}
button.danger{background:#3a1420;color:#ffd2cc;border:1px solid #a84a55}
#msg{margin-top:12px;min-height:1.4em}.error{color:#ffd2cc;background:#3a1420;border:1px solid #a84a55;border-radius:12px;padding:12px}
a{color:#ffc04d}.muted{color:#b9a3c9;font-size:.9em}
</style></head><body><main>
<h1 id="heading">Group admin</h1>
<p class="muted" id="need" hidden>Open the admin link you saved when you created this group.</p>
<form id="form">
  <label for="title">Title</label>
  <input id="title" maxlength="80">
  <label for="subtitle">Subtitle</label>
  <input id="subtitle" maxlength="160">
  <label for="months">Months of ordinances</label>
  <input id="months" type="number" min="1" max="120" value="12">
  <label for="open">Uploads open</label>
  <input id="open" type="datetime-local">
  <label for="close">Uploads close</label>
  <input id="close" type="datetime-local">
  <button type="submit">Save</button>
</form>
<button type="button" class="quiet" id="rotate">New admin link</button>
<p class="muted" id="fresh" hidden></p>
<button type="button" class="quiet" id="reset">Reset this group's lights</button>
<button type="button" class="danger" id="remove">Delete group</button>
<p id="msg" role="status" aria-live="polite"></p>
<p><a id="share" href="">Share page</a> · <a id="map" href="">Map</a></p>
</main><script>
const match=location.pathname.match(/^\/g\/([^/]+)\/admin\/?$/);
const slug=match?decodeURIComponent(match[1]):'';
const key='tom-admin-'+slug;
if(location.hash.length>1){
  sessionStorage.setItem(key, decodeURIComponent(location.hash.slice(1)));
  history.replaceState(null,'',location.pathname);
}
const token=sessionStorage.getItem(key)||'';
const msg=document.getElementById('msg');
document.getElementById('share').href='/g/'+encodeURIComponent(slug);
document.getElementById('map').href='/g/'+encodeURIComponent(slug)+'/map';
function note(text, bad){ msg.className=bad?'error':''; msg.textContent=text||''; }
function headers(){ return { authorization:'Bearer '+token, 'content-type':'application/json' }; }
function localValue(iso){
  if(!iso) return '';
  const date=new Date(iso);
  if(Number.isNaN(date.getTime())) return '';
  const pad=n=>String(n).padStart(2,'0');
  return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+'T'+pad(date.getHours())+':'+pad(date.getMinutes());
}
async function load(){
  const response=await fetch('/g/'+encodeURIComponent(slug)+'/api/group',{cache:'no-store'});
  if(!response.ok){ note('This group is not available.', true); form.hidden=true; return; }
  const group=await response.json();
  document.getElementById('heading').textContent=group.title||slug;
  title.value=group.title||'';
  subtitle.value=group.subtitle||'';
  months.value=String(group.months||12);
  open.value=localValue(group.uploadsOpen);
  close.value=localValue(group.uploadsClose);
  if(!token) document.getElementById('need').hidden=false;
}
form.onsubmit=async(event)=>{
  event.preventDefault();
  if(!token){ note('Open the admin link you saved.', true); return; }
  const response=await fetch('/g/'+encodeURIComponent(slug)+'/api/admin/settings',{
    method:'POST', headers:headers(),
    body:JSON.stringify({
      title:title.value, subtitle:subtitle.value, months:Number(months.value),
      uploadsOpen:open.value?new Date(open.value).toISOString():'',
      uploadsClose:close.value?new Date(close.value).toISOString():'',
    }),
  });
  const body=await response.json().catch(()=>({}));
  if(!response.ok){ note(body.error||'Could not save.', true); return; }
  document.getElementById('heading').textContent=body.title||slug;
  note('Saved.');
};
document.getElementById('reset').onclick=async()=>{
  if(!token){ note('Open the admin link you saved.', true); return; }
  if(!confirm('Clear this group\'s lights?')) return;
  const response=await fetch('/g/'+encodeURIComponent(slug)+'/api/admin/reset',{method:'POST',headers:headers()});
  note(response.ok?'Lights cleared.':'Could not reset.', !response.ok);
};
document.getElementById('remove').onclick=async()=>{
  if(!token){ note('Open the admin link you saved.', true); return; }
  if(!confirm('Hide this group? Its lights stay on the front page until a super-admin disables it.')) return;
  const response=await fetch('/g/'+encodeURIComponent(slug)+'/api/admin/delete',{method:'POST',headers:headers()});
  if(!response.ok){ note('Could not delete.', true); return; }
  location.href='/';
};
document.getElementById('rotate').onclick=async()=>{
  if(!token){ note('Open the admin link you saved.', true); return; }
  const response=await fetch('/g/'+encodeURIComponent(slug)+'/api/admin/rotate',{method:'POST',headers:headers()});
  const body=await response.json().catch(()=>({}));
  if(!response.ok){ note(body.error||'Could not rotate.', true); return; }
  sessionStorage.setItem(key, body.adminToken);
  const fresh=document.getElementById('fresh');
  fresh.hidden=false;
  fresh.textContent='New admin link: '+location.origin+body.adminPath;
};
load();
</script></body></html>
