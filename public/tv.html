function startTimeline() {

function startSpotlight() {

function setBloom(key) {

}
function focusOf(light) {

const versions = Version.watch({
  mode: 'tv',

function runStep() {

    setBloom(null);
    hideCard();

      paddingTopLeft: padPoint('topLeft'),
      paddingBottomRight: padPoint('bottomRight'),
      maxZoom: WORLD.zoom,

  setBloom(currentKey);
  showCard(step.light, deck.all());

    paddingTopLeft: padPoint('topLeft'),
    paddingBottomRight: padPoint('bottomRight'),
    maxZoom: SPOT_ZOOM,

}
function rememberLight(light) {

let serverStats = null;
function setStatText(el, value) {

}

  setStatText(document.getElementById('stat-countries'), (body && body.countries) || 0);
  setStatText(document.getElementById('stat-sharers'), (body && body.sharers) || 0);

  else {

    const partial = VisibleTotals.tally(shown, countryAt);
    const complete = catalog.size > 0 && shown.length >= catalog.size && serverStats;
    if (complete) paintBody(serverStats);

      countries: partial.countries,

function mapApi(path) {

const RESET_PIN = '1337';
const resetBtn = document.getElementById('reset');
