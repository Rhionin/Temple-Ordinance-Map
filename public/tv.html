<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temple Ordinance Lights</title>
<link rel="stylesheet" href="/vendor/leaflet.css"><script src="/vendor/leaflet.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07040c;font-family:Georgia,serif}
#stage{position:absolute;width:1920px;height:1080px;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center center;background:#07040c}
#map{position:absolute;inset:0;width:1920px;height:1080px;background:#07040c;visibility:hidden}
.leaflet-container{background:#07040c}
.leaflet-div-icon,.candle-icon{background:transparent;border:none}
#hud{position:fixed;top:24px;left:32px;z-index:999;max-width:980px;color:#ffd08a;text-shadow:0 0 14px #ff7a00}
#hud h1{margin:0;font-size:42px;color:#ffa31a}#count{font-size:72px;font-weight:bold;color:#fff3d6}
#count-label{font-size:28px}
#ticker{position:fixed;bottom:0;left:0;right:0;z-index:999;padding:14px 32px;font-size:28px;color:#ffd08a;background:linear-gradient(transparent,#07040cdd);text-shadow:0 0 10px #ff7a00}
.glow{width:14px;height:14px;border-radius:50%;background:radial-gradient(#fff8e0 0,#ffcf4d 30%,#ff8a00 60%,transparent 72%);
box-shadow:0 0 12px 5px #ff9a1a99,0 0 30px 12px #ff6a0055;animation:pop 1.6s ease-out,flick 2.4s infinite alternate}
.glow.bloom{filter:brightness(1.45);box-shadow:0 0 22px 14px #fff3c8ee,0 0 60px 28px #ffb000cc}
.glow.out{animation:fadeout 1.6s ease forwards}
@keyframes pop{0%{transform:scale(6);opacity:0}60%{transform:scale(1.6);opacity:1}100%{transform:scale(1)}}
@keyframes flick{0%{opacity:.75}25%{opacity:1}50%{opacity:.85}70%{opacity:.98}100%{opacity:.8}}
@keyframes fadeout{to{opacity:0;filter:brightness(.4)}}
#timeline{position:fixed;left:0;right:0;bottom:0;z-index:1002;padding:8px 6% 28px;text-align:center;pointer-events:none;
background:linear-gradient(transparent,#07040cf2)}
#month-label{margin:0;font-size:64px;font-weight:normal;color:#fff6e4;text-shadow:0 0 18px #ff7a00,0 2px 8px #000}
#progress{margin:14px auto 0;height:4px;width:min(640px,72%);background:rgba(255,255,255,.16);border-radius:4px;overflow:hidden}
#progress-bar{height:100%;width:0;background:linear-gradient(90deg,#ffb347,#fff1c9);box-shadow:0 0 12px #ff9a1a}
#card{position:fixed;right:40px;bottom:168px;z-index:1004;width:400px;padding:22px 26px 18px;color:#fff6e4;
background:linear-gradient(165deg,rgba(62,36,18,.9),rgba(18,10,24,.84));border:1px solid rgba(255,196,120,.45);border-radius:22px;
box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 40px rgba(255,140,40,.16);backdrop-filter:blur(10px);
opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .8s ease,transform .8s ease}
#card.show{opacity:1;transform:none}
#card .kicker{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#e7b56a}
#card h2{margin:8px 0;font-size:30px;font-weight:normal;line-height:1.25;color:#fff1d4}
#card .ord{margin:0;font-size:20px;line-height:1.4;color:#ffd08a;text-shadow:0 0 12px #ff7a0066}
#card .region{margin:12px 0 0;font-size:15px;color:#d9c4ae}
#stats{position:fixed;top:22px;right:72px;z-index:1001;width:440px;padding:16px 22px 12px;color:#fff6e4;
background:linear-gradient(160deg,rgba(32,18,48,.78),rgba(7,4,12,.62));border:1px solid rgba(255,196,120,.35);border-radius:20px;
box-shadow:0 12px 40px rgba(0,0,0,.35);pointer-events:none}
#stats .stat{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin:2px 0}
#stats .stat b{font-size:64px;line-height:.95;color:#fff3d6;font-weight:bold;text-shadow:0 0 16px #ff9a1a88}
#stats .stat span{font-size:28px;color:#ffd08a;text-shadow:0 0 10px #ff7a0066}
#stat-ordinances{list-style:none;margin:10px 0 0;padding:8px 0 0;border-top:1px solid rgba(255,196,120,.3)}
#stat-ordinances li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:1px 0}
#stat-ordinances b{font-size:32px;line-height:1.15;color:#fff3d6;font-weight:bold;min-width:2ch;text-align:right}
#stat-ordinances span{font-size:24px;color:#ffd08a}
.leaflet-control-attribution{background:#0008!important;color:#776!important}.leaflet-control-attribution a{color:#998!important}
#reset{position:fixed;top:18px;right:18px;z-index:1003;width:36px;height:36px;padding:0;border:0;border-radius:50%;
background:transparent;color:#ffd08a;font:18px/36px Georgia,serif;opacity:0;cursor:pointer;transition:opacity .4s ease}
#reset.show,#reset:focus-visible{opacity:.4}
#reset.show:hover,#reset:focus-visible{opacity:.9}
#reset-note{position:fixed;top:56px;right:18px;z-index:1003;margin:0;max-width:220px;text-align:right;font-size:14px;color:#e7b56a}
@media (prefers-reduced-motion:reduce){
  .glow,.glow.bloom{animation:none}
  #card{transition:none}
}
</style></head><body>
<div id="stage">
<div id="map"></div>
<div id="hud"><h1>🌼 Our Ancestors 🌼</h1><div><span id="count">0</span> <span id="count-label">ancestors</span></div></div>
<aside id="stats" aria-label="Temple work totals">
  <div class="stat"><b id="stat-ancestors">0</b><span>ancestors</span></div>
  <div class="stat"><b id="stat-countries">0</b><span>countries</span></div>
  <div class="stat"><b id="stat-sharers">0</b><span>people shared</span></div>
  <ul id="stat-ordinances">
    <li><b data-name="Baptism">0</b><span>Baptism</span></li>
    <li><b data-name="Confirmation">0</b><span>Confirmation</span></li>
    <li><b data-name="Initiatory">0</b><span>Initiatory</span></li>
    <li><b data-name="Endowment">0</b><span>Endowment</span></li>
    <li><b data-name="Sealing to Parents">0</b><span>Sealing to Parents</span></li>
    <li><b data-name="Sealing to Spouse">0</b><span>Sealing to Spouse</span></li>
  </ul>
</aside>
<div id="ticker">&nbsp;</div>
<div id="timeline" hidden>
  <p id="month-label">This year</p>
  <div id="progress" aria-hidden="true"><div id="progress-bar"></div></div>
</div>
<aside id="card" role="status" aria-live="polite" aria-hidden="true">
  <p class="kicker">Featured light</p>
  <h2 id="card-place"></h2>
  <p id="card-ord" class="ord"></p>
  <p id="card-region" class="region"></p>
</aside>
<button id="reset" type="button" aria-label="Reset lights" title="Reset">↺</button>
<p id="reset-note" hidden></p>
</div>
<script src="/country-at.js"></script>
<script src="/visible-totals.js"></script>
<script src="/version.js"></script>
<script src="/spotlight.js"></script>
<script src="/timeline.js"></script>
<script src="/timeline-camera.js"></script>
<script>
function fitStage() {
  const fit = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.documentElement.style.setProperty('--fit', String(fit > 0 ? fit : 1));
}
fitStage();
window.addEventListener('resize', fitStage);
const WORLD = { center: [25, 0], zoom: 2.4 };
const SPOT_ZOOM = 4.8;
const DWELL_MS = 9000;
const map = L.map('map', { zoomControl: false, worldCopyJump: true, zoomSnap: 0, renderer: L.svg({ padding: 0.8 }) }).setView(WORLD.center, WORLD.zoom);
map.getContainer().style.visibility = 'hidden';
// Leaflet's SVG renderer only redraws paths on moveend. During flyTo it CSS-scales
// the previous viewport, so the destination is blank until the flight ends.
function paintCountriesDuringMove() {
  const renderer = map.getRenderer(map);
  map.on('move', () => {
    if (!renderer || renderer._busy || !renderer._layers) return;
    renderer._busy = true;
    try {
      for (const id in renderer._layers) {
        const layer = renderer._layers[id];
        if (layer._map && typeof layer._project === 'function') layer._project();
      }
      if (typeof renderer._update === 'function') renderer._update();
    } catch (error) { /* the next frame draws again */ }
    finally { renderer._busy = false; }
  });
}
paintCountriesDuringMove();
let countryAt = function () { return null; };
fetch('/world.geojson').then(r => r.json()).then(g => {
  countryAt = CountryAt.fromGeoJSON(g);
  L.geoJSON(g, { interactive: false, style: { color: '#6b3f8a', weight: .7, fillColor: '#1d1230', fillOpacity: 1 } }).addTo(map).bringToBack();
  paintTotals();
});
map.attributionControl.addAttribution('Natural Earth');

const params = new URLSearchParams(location.search);
const askedMode = params.get('mode');
const playMode = askedMode === 'timeline' || askedMode === 'spotlight' ? askedMode : 'alternate';
const cycleRaw = Number(params.get('cycle'));
const cycleMs = Number.isFinite(cycleRaw) && cycleRaw > 0 ? Math.min(180, Math.max(30, cycleRaw)) * 1000 : 75000;
const SPOT_LIGHTS = 4;
const countLabel = document.getElementById('count-label');
const cardPlace = document.getElementById('card-place');
const cardOrd = document.getElementById('card-ord');
const cardRegion = document.getElementById('card-region');
const monthLabel = document.getElementById('month-label');
const progressBar = document.getElementById('progress-bar');
const timelineHud = document.getElementById('timeline');
let rotation = Spotlight.createRotation({ every: 4 });
const markers = new Map();
const spots = new Set();
const catalog = new Map();
let since = 0;
let ready = false;
let polling = false;
let mapEpoch = 0;
let countN = 0;
let bloomKey = null;
let currentKey = null;
let mode = 'idle';
let timer = 0;
let act = playMode === 'spotlight' ? 'spotlight' : 'timeline';
let playhead = -1;
let timelineNow = Date.now();
let timelineScript = null;
let scriptStart = 0;
let eventCursor = 0;
let spotLightsShown = 0;
let timelineGen = 0;
let pinnedBox = null;
let timelineWide = false;
let cameraToken = 0;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function flyOpts() {
  return { animate: !reduceMotion, duration: reduceMotion ? 0.01 : 2.8, easeLinearity: 0.25 };
}
function noteSince(light) {
  const stamp = Number(light.updated || light.created) || 0;
  if (stamp > since) since = stamp;
}
function paint(entry) {
  if (entry.marker) return;
  const light = entry.light;
  const coordKey = Number(light.lat).toFixed(3) + ',' + Number(light.lon).toFixed(3);
  let lat = Number(light.lat);
  let lon = Number(light.lon);
  if (spots.has(coordKey)) {
    lat += (Math.random() - 0.5) * 0.3;
    lon += (Math.random() - 0.5) * 0.3;
  }
  spots.add(coordKey);
  const icon = L.divIcon({
    className: 'candle-icon',
    html: '<div class="glow" style="animation-delay:0s,' + (Math.random() * 2).toFixed(2) + 's"></div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });
  entry.marker = L.marker([lat, lon], { icon: icon, interactive: false }).addTo(map);
  const root = entry.marker.getElement();
  entry.el = root ? root.querySelector('.glow') : null;
  if (entry.el && bloomKey === entry.key) entry.el.classList.add('bloom');
}
function present(light, delay) {
  const key = Spotlight.lightKey(light);
  const existing = markers.get(key);
  if (existing) {
    existing.light = light;
    if (!existing.marker) {
      clearTimeout(existing.timer);
      paint(existing);
    }
    return existing;
  }
  const entry = { key, light, el: null, marker: null, timer: 0 };
  markers.set(key, entry);
  setCount(markers.size);
  if (delay > 0) entry.timer = setTimeout(() => paint(entry), delay);
  else paint(entry);
  return entry;
}
function setCount(n) {
  countN = n;
  count.textContent = String(countN);
  const yearView = act !== 'timeline' || timelineWide;
  countLabel.textContent = yearView
    ? (countN === 1 ? 'ancestor this year' : 'ancestors this year')
    : TimelineCamera.ancestorLabel(countN, false);
}
function showTimelineChrome(on) {
  timelineHud.hidden = !on;
  ticker.hidden = on;
}
function clearMarkers() {
  for (const entry of markers.values()) {
    clearTimeout(entry.timer);
    if (entry.marker) map.removeLayer(entry.marker);
  }
  markers.clear();
  spots.clear();
  setBloom(null);
  setCount(0);
  paintTotals();
}
function fadeMarkers() {
  for (const entry of markers.values()) if (entry.el) entry.el.classList.add('out');
}
function revealedLights() {
  return [...markers.values()].map(entry => entry.light);
}
function revealLight(light) {
  const entry = present(light, 0);
  setBloom(entry.key);
  showCard(entry.light, revealedLights());
  paintTotals();
  expandTimelineCamera([light]);
  return entry;
}
function revealMissed() {
  for (const light of catalog.values()) {
    if (markers.has(Spotlight.lightKey(light))) continue;
    if (Timeline.frameIndex(light.month, timelineNow, 12) < playhead) revealLight(light);
  }
}
function pointsOf(lights) {
  return (lights || []).map(light => ({ lat: light.lat, lon: light.lon }));
}
function rememberPinned(lights) {
  const result = TimelineCamera.cover(pinnedBox, pointsOf(lights));
  pinnedBox = result.box;
  return result.grew;
}
function fittedCamera(cap) {
  const view = TimelineCamera.spanBox(pinnedBox, 0.5);
  const bounds = L.latLngBounds([view.south, view.west], [view.north, view.east]);
  const fitted = map._getBoundsCenterZoom(bounds, {
    paddingTopLeft: L.point(140, 160),
    paddingBottomRight: L.point(140, 220),
    maxZoom: cap,
  });
  return { center: fitted.center, zoom: TimelineCamera.zoomOutOnly(cap, fitted.zoom) };
}
function easeCamera(center, zoom) {
  const token = ++cameraToken;
  const dest = L.latLng(center);
  const start = map.getCenter();
  const startZoom = map.getZoom();
  const endZoom = TimelineCamera.zoomOutOnly(startZoom, zoom);
  if (reduceMotion || endZoom == null) {
    map.setView(dest, endZoom == null ? startZoom : endZoom, { animate: false });
    return;
  }
  const startPx = map.project(start, endZoom);
  const destPx = map.project(dest, endZoom);
  const t0 = performance.now();
  const duration = 1700;
  function frame(now) {
    if (token !== cameraToken) return;
    const t = Math.min(1, (now - t0) / duration);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const zooming = startZoom - endZoom > 0.02;
    const zoomPart = zooming ? Math.min(1, e / 0.65) : 1;
    const panPart = zooming ? Math.max(0, (e - 0.65) / 0.35) : e;
    const z = startZoom + (endZoom - startZoom) * zoomPart;
    let lat = start.lat;
    let lng = start.lng;
    if (panPart > 0) {
      const px = startPx.add(destPx.subtract(startPx).multiplyBy(panPart));
      const ll = map.unproject(px, endZoom);
      lat = ll.lat;
      lng = ll.lng;
    }
    map.setView([lat, lng], z, { animate: false });
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function moveTimelineCamera(allowZoomIn) {
  if (!pinnedBox || timelineWide) return;
  const cap = allowZoomIn ? 4.2 : map.getZoom();
  const fitted = fittedCamera(cap);
  if (!fitted.center || fitted.zoom == null) return;
  if (!allowZoomIn && fitted.zoom > map.getZoom() + 0.01) return;
  if (allowZoomIn || reduceMotion) {
    cameraToken += 1;
    map.setView(fitted.center, fitted.zoom, { animate: false });
    return;
  }
  const here = map.project(map.getCenter(), fitted.zoom);
  const there = map.project(fitted.center, fitted.zoom);
  if (Math.abs(fitted.zoom - map.getZoom()) < 0.02 && here.distanceTo(there) < 12) return;
  easeCamera(fitted.center, fitted.zoom);
}
function frameFirstLights() {
  const frames = (timelineScript && timelineScript.frames) || [];
  const first = frames.find(frame => frame.lights && frame.lights.length);
  rememberPinned(first ? first.lights : []);
  if (!pinnedBox) {
    cameraToken += 1;
    map.setView(WORLD.center, WORLD.zoom, { animate: false });
    return;
  }
  moveTimelineCamera(true);
}
function expandTimelineCamera(lights) {
  if (timelineWide) return;
  if (rememberPinned(lights)) moveTimelineCamera(false);
}
function applyTimelineEvent(event) {
  if (event.type === 'frame') {
    playhead = event.index;
    monthLabel.textContent = event.label;
    revealMissed();
    const scripted = new Set((event.lights || []).map(light => Spotlight.lightKey(light)));
    for (const light of catalog.values()) {
      if (scripted.has(Spotlight.lightKey(light))) continue;
      if (Timeline.frameIndex(light.month, timelineNow, 12) === playhead) revealLight(light);
    }
  } else if (event.type === 'reveal') {
    revealLight(event.light);
  } else if (event.type === 'hold') {
    playhead = 99;
    monthLabel.textContent = 'This year';
    timelineWide = true;
    revealMissed();
    setCount(countN);
    easeCamera(WORLD.center, WORLD.zoom);
  } else if (event.type === 'fade') {
    fadeMarkers();
  } else if (event.type === 'restart') {
    finishTimeline();
  }
}
function tickTimeline() {
  const gen = timelineGen;
  if (act !== 'timeline' || !timelineScript) return;
  const elapsed = Date.now() - scriptStart;
  progressBar.style.width = Math.min(100, (elapsed / timelineScript.total) * 100) + '%';
  while (eventCursor < timelineScript.events.length && timelineScript.events[eventCursor].t <= elapsed) {
    const event = timelineScript.events[eventCursor];
    eventCursor += 1;
    applyTimelineEvent(event);
    if (timelineGen !== gen) return;
  }
  if (timelineGen !== gen) return;
  timer = setTimeout(tickTimeline, 80);
}
function startTimeline() {
  timelineGen += 1;
  act = 'timeline';
  cameraToken += 1;
  pinnedBox = null;
  timelineWide = false;
  clearTimeout(timer);
  hideCard();
  showTimelineChrome(true);
  clearMarkers();
  currentKey = null;
  mode = 'idle';
  playhead = -1;
  timelineNow = Date.now();
  monthLabel.textContent = Timeline.labelFor(Timeline.monthsEnding(timelineNow, 12)[0]);
  progressBar.style.width = '0%';
  timelineScript = Timeline.buildScript([...catalog.values()], timelineNow, cycleMs);
  scriptStart = Date.now();
  eventCursor = 0;
  frameFirstLights();
  map.getContainer().style.visibility = 'visible';
  tickTimeline();
}
function finishTimeline() {
  if (versions.boundary()) return;
  clearTimeout(timer);
  clearMarkers();
  if (playMode === 'alternate') startSpotlight();
  else startTimeline();
}
function startSpotlight() {
  act = 'spotlight';
  map.getContainer().style.visibility = 'visible';
  clearTimeout(timer);
  showTimelineChrome(false);
  hideCard();
  clearMarkers();
  rotation = Spotlight.createRotation({ every: 4 });
  const lights = [...catalog.values()];
  rotation.seed(lights);
  lights.forEach((light, index) => present(light, Math.min(index * 90, 1500)));
  spotLightsShown = 0;
  mode = 'idle';
  currentKey = null;
  timer = setTimeout(runStep, lights.length ? 900 : 400);
}
function setBloom(key) {
  if (bloomKey && bloomKey !== key) {
    const prev = markers.get(bloomKey);
    if (prev && prev.el) prev.el.classList.remove('bloom');
  }
  bloomKey = key;
  if (!key) return;
  const entry = markers.get(key);
  if (entry && entry.el) entry.el.classList.add('bloom');
}
function showCard(light, pool) {
  const caption = Spotlight.captionFor(light, pool || rotation.all());
  cardPlace.textContent = caption.place;
  cardOrd.textContent = caption.ordinancesText;
  cardRegion.textContent = caption.regionText;
  cardRegion.hidden = !caption.regionText;
  card.classList.add('show');
  card.setAttribute('aria-hidden', 'false');
  ticker.textContent = '🕯️ ' + caption.place;
}
function hideCard() {
  card.classList.remove('show');
  card.setAttribute('aria-hidden', 'true');
}
function focusOf(light) {
  const entry = markers.get(Spotlight.lightKey(light));
  if (entry && entry.marker) return entry.marker.getLatLng();
  return [Number(light.lat), Number(light.lon)];
}
const versions = Version.watch({
  mode: 'tv',
  reload() { location.reload(); },
});
function runStep() {
  if (versions.boundary()) return;
  if (act !== 'spotlight') return;
  const step = rotation.next();
  mode = step.type;
  if (step.type === 'light') {
    currentKey = step.light.key;
    present(step.light, 0);
    setBloom(currentKey);
    showCard(step.light);
    map.flyTo(focusOf(step.light), SPOT_ZOOM, flyOpts());
  } else if (step.type === 'world') {
    currentKey = null;
    setBloom(null);
    hideCard();
    map.flyTo(WORLD.center, WORLD.zoom, flyOpts());
  } else {
    currentKey = null;
    setBloom(null);
    hideCard();
  }
  const wait = step.type === 'idle' ? 2000 : DWELL_MS;
  if (playMode === 'alternate' && (step.type === 'light' || step.type === 'idle')) {
    spotLightsShown += 1;
    if (spotLightsShown >= SPOT_LIGHTS) {
      timer = setTimeout(startTimeline, wait);
      return;
    }
  }
  timer = setTimeout(runStep, wait);
}
function wake() {
  if (act !== 'spotlight' || mode !== 'idle') return;
  clearTimeout(timer);
  timer = setTimeout(runStep, 700);
}
function rememberLight(light) {
  catalog.set(Spotlight.lightKey(light), light);
  noteSince(light);
}
let serverStats = null;
function paintBody(body) {
  document.getElementById('stat-ancestors').textContent = String((body && body.ancestors) || 0);
  document.getElementById('stat-countries').textContent = String((body && body.countries) || 0);
  document.getElementById('stat-sharers').textContent = String((body && body.sharers) || 0);
  const counts = (body && body.ordinances) || {};
  for (const name of VisibleTotals.ORDINANCES) {
    const el = document.querySelector('#stat-ordinances [data-name="' + name + '"]');
    if (el) el.textContent = String(counts[name] || 0);
  }
}
function paintTotals() {
  if (act !== 'timeline') {
    paintBody(serverStats);
    return;
  }
  const shown = revealedLights();
  const partial = VisibleTotals.tally(shown, countryAt);
  const complete = catalog.size > 0 && shown.length >= catalog.size && serverStats;
  if (complete) {
    paintBody(serverStats);
    return;
  }
  paintBody({
    ancestors: partial.ancestors,
    countries: partial.countries,
    sharers: VisibleTotals.sharersShown(shown.length, catalog.size, serverStats && serverStats.sharers),
    ordinances: partial.ordinances,
  });
}
async function refreshStats() {
  try {
    const response = await fetch('/api/stats', { cache: 'no-store' });
    if (!response.ok) return;
    serverStats = await response.json();
    paintTotals();
  } catch (error) { /* the next poll retries */ }
}
async function poll() {
  if (polling) return;
  polling = true;
  const epoch = mapEpoch;
  const statsTask = refreshStats();
  try {
    const response = await fetch('/api/lights?since=' + since, { cache: 'no-store' });
    const rows = await response.json();
    if (epoch !== mapEpoch) return;
    if (!Array.isArray(rows)) return;
    if (!ready) {
      rows.forEach(rememberLight);
      ready = true;
      if (playMode === 'spotlight') startSpotlight();
      else startTimeline();
      return;
    }
    let arrived = 0;
    for (const light of rows) {
      rememberLight(light);
      if (act === 'timeline') {
        const index = Timeline.frameIndex(light.month, timelineNow, 12);
        if (index <= playhead) revealLight(light);
        continue;
      }
      if (rotation.has(light)) {
        rotation.update(light);
        if (Spotlight.lightKey(light) === currentKey) showCard(rotation.get(light));
      } else {
        rotation.arrive(light);
        present(light, 0);
        ticker.textContent = '🕯️ ' + light.place;
        arrived += 1;
      }
    }
    if (arrived) wake();
  } catch (error) { /* keep the map up; the next poll retries */ }
  finally { polling = false; await statsTask; }
}
const RESET_PIN = '1337';
const resetBtn = document.getElementById('reset');
const resetNote = document.getElementById('reset-note');
let resetHide = 0;
function revealReset() {
  resetBtn.classList.add('show');
  clearTimeout(resetHide);
  resetHide = setTimeout(() => resetBtn.classList.remove('show'), 2500);
}
document.addEventListener('mousemove', revealReset);
document.addEventListener('touchstart', revealReset, { passive: true });
function emptyMap() {
  mapEpoch++;
  timelineGen += 1;
  catalog.clear();
  spots.clear();
  since = 0;
  ready = true;
  resetNote.hidden = true;
  resetNote.textContent = '';
  ticker.textContent = '\u00a0';
  if (playMode === 'spotlight') startSpotlight();
  else startTimeline();
}
resetBtn.addEventListener('click', async () => {
  const typed = window.prompt('PIN');
  if (typed == null) return;
  if (String(typed).trim() !== RESET_PIN) {
    resetNote.hidden = false;
    resetNote.textContent = 'That PIN is not right.';
    return;
  }
  if (!window.confirm('Clear all lights and start over?')) return;
  resetNote.hidden = true;
  try {
    const response = await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Reset-Pin': RESET_PIN },
      body: JSON.stringify({ pin: RESET_PIN }),
    });
    if (!response.ok) {
      resetNote.hidden = false;
      resetNote.textContent = 'Could not reset.';
      return;
    }
    emptyMap();
  } catch (error) {
    resetNote.hidden = false;
    resetNote.textContent = 'Could not reset.';
  }
});
poll();
setInterval(poll, 2000);
</script></body></html>
