"$schema" = "node_modules/wrangler/config-schema.json"
name = "temple-ordinance-map"
main = "src/worker.js"
compatibility_date = "2026-10-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Serve public/ (upload page, TV page, Natural Earth outlines).
# API routes and the two HTML entry points run the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = ["/api/*", "/", "/tv", "/tv/", "/new", "/g/*"]

# Do not put a Cloudflare account id here. The deploy workflow sets
# CLOUDFLARE_ACCOUNT_ID in the job environment.
[[d1_databases]]
binding = "DB"
database_name = "temple-ordinance-map"
database_id = "3ac5318c-7b9f-45d5-a5d0-862076f3e4b2"
migrations_dir = "migrations"

# One object paces Nominatim for the whole map.
[[durable_objects.bindings]]
name = "GEOCODER"
class_name = "Geocoder"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Geocoder"]

# RESET_TOKEN stays a secret (npx wrangler secret put RESET_TOKEN).
# Deploys do not set or overwrite it. GEOCODE_UA is a plain var.
[vars]
GEOCODE_UA = "Temple-Ordinance-Map (rhionin@gmail.com)"
# Replaced on deploy with the commit SHA (see deploy.yml). "dev" never changes,
# so a local worker does not reload itself.
BUILD_ID = "dev"

# Subdomain on the rhionin.com zone (same Cloudflare account). A path on the
# apex does not match this app's root routes (/ , /tv, /api).
[[routes]]
pattern = "temple-ordinance-map.rhionin.com"
custom_domain = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1
